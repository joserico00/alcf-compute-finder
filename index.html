<!doctype html>
<!--
  Serverless (GitHub Pages) build of the ALCF Compute Finder.

  This page runs the real app.py entirely in the browser using stlite
  (Streamlit compiled to WebAssembly via Pyodide). No server, no install:
  push this file + app.py to a repo, enable GitHub Pages, done.

  Notes:
  * First load downloads the Python runtime (~tens of MB) - give it ~20-60 s
    once; it is cached afterwards.
  * The CDN URLs below are pinned to one @stlite/browser release, so an
    upstream change cannot alter this page without a commit here. To move to
    a newer one, bump the version in both URLs and reload; the releases are
    listed at https://github.com/whitphx/stlite/releases.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALCF Compute Finder</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.css"
    />
    <style>
      /* Simple loading message shown until Pyodide finishes booting */
      #boot-note {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8494a4; padding: 2rem; font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-note">
        Loading the ALCF Compute Finder&hellip; first visit downloads the
        in-browser Python runtime (roughly 20&ndash;60 seconds). It is cached
        after that.
      </div>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js";
      mount(
        {
          requirements: ["pandas"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
